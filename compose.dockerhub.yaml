name: am-download

services:
  wrapper:
    image: bobcc4/am-download-wrapper:v1.0.4
    platform: linux/amd64
    container_name: am-download-wrapper
    restart: unless-stopped
    privileged: true
    environment:
      # Change this value and keep it identical in both services.
      MANAGER_TOKEN: change-this-manager-token
      TZ: Asia/Shanghai
    volumes:
      - wrapper-data:/app/rootfs/data
    networks: [am-download]
    healthcheck:
      test: ["CMD", "/usr/local/bin/wrapper-manager", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4

  app:
    image: bobcc4/am-download:v1.0.4
    platform: linux/amd64
    container_name: am-download
    restart: unless-stopped
    depends_on:
      wrapper:
        condition: service_healthy
    environment:
      MANAGER_TOKEN: change-this-manager-token
      # Change this password before exposing the Web UI to a network.
      AM_DOWNLOAD_PASSWORD: change-this-password
      TZ: Asia/Shanghai
    ports:
      - "8333:8080"
    volumes:
      - app-data:/data
      - downloads:/downloads
    networks: [am-download]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]

networks:
  am-download:
    name: am-download

volumes:
  app-data:
    name: am-download-data
  wrapper-data:
    name: am-download-wrapper-data
  downloads:
    name: am-download-files
